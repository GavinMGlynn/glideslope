name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The full run, every preset and every label, on main every night (16:00
  # UTC, two in the morning in Sydney); a failure there is a red tree.
  schedule:
    - cron: '0 16 * * *'

# One run per branch. A newer push says everything an older run would have, so
# the older run is cancelled rather than left to hold a runner.
concurrency:
  # The event too: a merge's build-only run must not cancel the nightly full run.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# The windowed frame tests skip where there is no display to open a window on;
# here that is a failure, and the Linux jobs run their tests on Xvfb.
#
# Likewise the tests that read downloaded data - DEM tiles, the geoid - skip
# without the network, and here must not. The downloads are kept between runs
# in .downloads, keyed on the lists that pin them (tests/data/downloads/files.txt
# and assets/models/sources.txt) and the run that saved them:
# one copy for every platform (enableCrossOsArchive), without the Cesium tile
# caches the tests write there, which are theirs and not pinned.
#
# Cesium Native's dependencies are built by vcpkg (cmake/Vcpkg.cmake). On Linux
# and macOS vcpkg's binary cache is kept between runs in .vcpkg-archives, keyed
# on the toolchain and everything that decides what is built; on Windows it is
# a NuGet feed in GitHub Packages (.github/actions/vcpkg-github-packages), one
# package per ABI, written by main and by a pull request that changes nothing
# which could shape a package (the changes job decides; the action says why).
#
# **Only main saves a cache; a pull request only restores.** A pull request can
# read main's caches and nobody else's, and all of them share the repository's
# 10 GB: when every pull request saved its own ccache and downloads (2.5 GB a
# platform), main's were pushed out, and builds compiled everything from
# nothing, 0% ccache hits, 20-35 minutes each. On Linux and macOS, a pull
# request that changes vcpkg's dependencies builds them afresh on each push
# until it lands.
env:
  GLIDESLOPE_REQUIRE_WINDOW: 1
  GLIDESLOPE_REQUIRE_NETWORK: 1
  GLIDESLOPE_DOWNLOADS: .downloads

# **Every configuration is built once, in a job of its own, and its tests are
# split across several jobs that run at once.**
#
# This used to be one job per platform building debug and then release, and
# running each whole suite after its build, all in one step: the Ubuntu job's
# debug "build, test" step alone took 53 minutes, and Windows debug hit its
# 90-minute limit. Now:
#
#   - Each configuration builds in its own job, all of them at once.
#   - ccache keeps compiled objects between runs on every platform, so a push
#     that changes one file recompiles one file. Without it every push
#     compiled all of Cesium Native and everything of ours from nothing.
#   - A build packs what its tests need - the programs, the test data, the
#     CTest files, not the objects or static libraries - and uploads it once.
#   - Its tests run in shards, each a job on its own runner, four tests at a
#     time (three on macOS). A test's fixture - the downloads, the seven view
#     tests before the one that compares them - comes with it wherever it runs.
#     The tests are dealt to the shards by what each costs on CI
#     (tools/ci_shard.cmake, from tests/ci_costs/, measured by
#     tools/ci_test_costs.py), longest first, not by number: dealt by number
#     (`-I k,,n`) one Linux debug shard took 25 minutes and another 18. Every
#     shard's job is to stay under two thirds of its 30-minute limit. Linux
#     debug went from seven shards to ten on 2026-10-07: with the costs
#     estimated for the newest tests, shards of seven ran past 30 minutes.
#     Later that day every table was measured again from three green runs
#     and the counts set so that each shard holds about 15 minutes of
#     measured work: Linux debug 11, Windows debug 7, Windows release and
#     clang-cl 3, macOS debug 5.
#   - Build and test are separate steps, so each one's time is in plain view.
#
# A shard cannot finish sooner than its longest test, which is why no test may
# be very long: the view test that shot all seven views in one took ten
# minutes, and is seven tests and a comparison now.
#
# **Tiers** (decided 2026-09-30, after 17 of 29 runs failed on tests that bound
# a step against the wall clock under a sanitizer):
#   - A pull request: every preset builds and tests, except that the debug
#     presets leave out LABELS timing (tests/CMakeLists.txt says why); the
#     release presets run it. The debug presets leave it out every night too:
#     those tests assert the 20 fps their bounds are claimed at, and fail
#     as testing nothing where it is not met - as windows-release has, at
#     102, 77 and 75 ms around a switch (runs 36638803155, 36678421057,
#     36681942297; not yet seen passing, PROJECT_STATUS.md 2026-09-30).
#   - A push to main, after a merge: the builds only - the tree was tested
#     before it merged, since main takes a branch only when it is up to date -
#     which keeps main's caches warm for the pull requests that restore them.
#   - Every night (schedule): everything, every preset, timing in release.
#
# **Every preset runs somewhere.** The Linux presets on Ubuntu (both) and Rocky 9
# (release), the macOS presets on macOS, the Windows presets on Windows. A
# preset that no job runs is a preset nobody knows still works.

jobs:
  # ---------------------------------------------------------------------------
  # Ubuntu
  # ---------------------------------------------------------------------------
  ubuntu-build:
    name: Ubuntu ${{ matrix.preset }} - build
    # actions: write, to prune main's older ccache once this one is saved.
    permissions: { contents: read, actions: write }
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: { preset: [linux-debug, linux-release] }
    env:
      CXX: g++-14
      CC: gcc-14
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 700M
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/ubuntu-setup

      - name: Keep vcpkg's binary cache in the workspace
        run: |
          mkdir -p .vcpkg-archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-archives" >> "$GITHUB_ENV"
      # **vcpkg's cache is keyed on the toolchain as well as the ports.** vcpkg
      # hashes the compiler into every package's ABI, and GitHub rolls new runner
      # images out with new compilers (MSVC 19.51.36257 to .36260, 2026-09-01): on
      # the new image every package missed and was rebuilt, 26-28 minutes, and the
      # rebuild was never saved because the key still matched. With the image (or,
      # on Rocky, the toolset) in the key, a new toolchain misses once and saves.
      - name: The toolchain vcpkg's packages are built with
        id: toolchain
        shell: bash
        run: |
          if [ -n "${ImageVersion:-}" ]; then id="$ImageOS-$ImageVersion"
          else id="$(rpm -q gcc-toolset-14-gcc-c++ 2>/dev/null || g++ --version | head -1)"; fi
          echo "id=$(printf '%s' "$id" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"
          echo "vcpkg's toolchain: $id"
      - uses: actions/cache/restore@v6
        id: vcpkg-cache
        with:
          path: .vcpkg-archives
          key: vcpkg-ubuntu-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}
          restore-keys: |
            vcpkg-ubuntu-${{ steps.toolchain.outputs.id }}-
            vcpkg-ubuntu-
      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-ubuntu-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-ubuntu-${{ matrix.preset }}-

      # No module scanning: glideslope has no C++ modules, and ccache will not
      # cache a compile GCC 14 has scanned - 80% of calls were uncacheable.
      - name: ${{ matrix.preset }} - configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
      - uses: actions/cache/save@v6
        if: ${{ github.event_name != 'pull_request' && !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        with:
          path: .vcpkg-archives
          key: vcpkg-ubuntu-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}

      - name: ${{ matrix.preset }} - build
        run: |
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }}
          ccache --show-stats
      - uses: actions/cache/save@v6
        if: ${{ github.event_name != 'pull_request' && !cancelled() }}
        with:
          path: .ccache
          key: ccache-ubuntu-${{ matrix.preset }}-${{ github.sha }}
      - uses: ./.github/actions/prune-cache
        if: ${{ github.event_name != 'pull_request' && !cancelled() }}
        with:
          prefix: ccache-ubuntu-${{ matrix.preset }}-
          keep: ccache-ubuntu-${{ matrix.preset }}-${{ github.sha }}
          token: ${{ github.token }}

      - name: Pack what the tests need
        run: |
          tar -czf tree.tar.gz --exclude='*.o' --exclude='*.a' --exclude=CMakeFiles \
              --exclude=.ninja_deps --exclude=.ninja_log --exclude='frames' \
              build/${{ matrix.preset }}
          ls -la tree.tar.gz
      - uses: actions/upload-artifact@v7
        with: { name: 'tree-ubuntu-${{ matrix.preset }}', path: tree.tar.gz, retention-days: 1, compression-level: 0 }

      # For the cross-platform job at the end: what this platform's release
      # build flies. See tests/cmake/cross_platform_flights.cmake.
      - name: Flights for the cross-platform check
        if: ${{ matrix.preset == 'linux-release' }}
        run: |
          mkdir -p flights
          ./build/linux-release/glideslope_cli figures c172p > flights/ubuntu-gcc.figures.txt
          ./build/linux-release/glideslope_cli selftest > flights/ubuntu-gcc.selftest.txt
          ./build/linux-release/glideslope_cli air > flights/ubuntu-gcc.air.txt
          cat flights/*
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.preset == 'linux-release' }}
        with: { name: flights-ubuntu-gcc, path: flights/, if-no-files-found: error }

  ubuntu-test:
    name: Ubuntu ${{ matrix.preset }} - tests ${{ matrix.shard }}/${{ matrix.of }}
    needs: ubuntu-build
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-debug, shard: 1, of: 11 }
          - { preset: linux-debug, shard: 2, of: 11 }
          - { preset: linux-debug, shard: 3, of: 11 }
          - { preset: linux-debug, shard: 4, of: 11 }
          - { preset: linux-debug, shard: 5, of: 11 }
          - { preset: linux-debug, shard: 6, of: 11 }
          - { preset: linux-debug, shard: 7, of: 11 }
          - { preset: linux-debug, shard: 8, of: 11 }
          - { preset: linux-debug, shard: 9, of: 11 }
          - { preset: linux-debug, shard: 10, of: 11 }
          - { preset: linux-debug, shard: 11, of: 11 }
          - { preset: linux-release, shard: 1, of: 2 }
          - { preset: linux-release, shard: 2, of: 2 }
    env:
      CXX: g++-14
      CC: gcc-14
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/ubuntu-setup
      - uses: actions/cache/restore@v6
        with:
          path: |
            .downloads/*
            !.downloads/cesium-*.sqlite
            !.downloads/test-scratch
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-${{ github.run_id }}
          restore-keys: |
            downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-
            downloads-
          enableCrossOsArchive: true
      - uses: actions/download-artifact@v8
        with: { name: 'tree-ubuntu-${{ matrix.preset }}' }
      - run: tar -xzf tree.tar.gz && rm tree.tar.gz

      - name: ${{ matrix.preset }} - tests ${{ matrix.shard }} of ${{ matrix.of }}
        run: |
          cmake -DPRESET=${{ matrix.preset }} -DSHARD=${{ matrix.shard }} -DOF=${{ matrix.of }} -DOUT=shard.txt -P tools/ci_shard.cmake
          Xvfb :99 -screen 0 1280x1024x24 & xvfb=$!
          rc=0; DISPLAY=:99 ctest --preset ${{ matrix.preset }} -I "$PWD/shard.txt" ${{ endsWith(matrix.preset, '-debug') && '-LE timing' || '' }} || rc=$?
          kill $xvfb
          exit $rc
      # Every frame the tests wrote, to look at.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with: { name: 'frames-ubuntu-${{ matrix.preset }}-${{ matrix.shard }}', path: 'build/${{ matrix.preset }}/tests/frames/*.bmp', if-no-files-found: ignore }
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          path: |
            .downloads/*
            !.downloads/cesium-*.sqlite
            !.downloads/test-scratch
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-${{ github.run_id }}
          enableCrossOsArchive: true

  # ---------------------------------------------------------------------------
  # Rocky 9: one release build and its tests, in one job - it is short enough
  # that splitting it would cost more in setting up runners than it saves, and
  # every extra runner is another dnf install against mirrors that have taken
  # half an hour to answer.
  # ---------------------------------------------------------------------------
  rocky:
    name: Rocky 9 linux-release - build, tests
    # actions: write, to prune main's older ccache once this one is saved.
    permissions: { contents: read, actions: write }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: rockylinux/rockylinux:9
    env:
      CCACHE_DIR: /__w/glideslope/glideslope/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      # Rocky 9's own compiler is GCC 11, so the build uses gcc-toolset-14, as
      # REQUIREMENTS.md's RHEL note says. ninja-build is in CRB.
      # `install_weak_deps=False` is dnf's --no-install-recommends.
      - name: Install dependencies
        run: |
          dnf_opts="--setopt=install_weak_deps=False --setopt=tsflags=nodocs -y"
          # Rocky's mirrors go away for minutes at a time, and gearstick's CI
          # learned to tell that apart from a real failure by retrying.
          dnf_run() {
            for attempt in 1 2 3 4; do
              if dnf $dnf_opts "$@"; then return 0; fi
              echo "::warning::dnf attempt $attempt failed; clearing the cache and retrying"
              dnf clean all || true
              sleep $((attempt * 15))
            done
            echo "::error::dnf would not complete in four attempts"
            return 1
          }
          # EPEL and CRB for SDL's X11 and Wayland development packages, and
          # Mesa's lavapipe for the frame tests.
          dnf_run install epel-release
          # autoconf, autoconf-archive, automake and libtool: vcpkg's libsodium
          # port builds with autotools. ccache: a push that changes one file
          # recompiles one file.
          dnf_run --enablerepo=crb install git cmake ninja-build gcc-c++ \
            autoconf autoconf-archive automake libtool ccache \
            gcc-toolset-14-gcc-c++ jq \
            libX11-devel libXext-devel libXrandr-devel libXi-devel \
            libXcursor-devel libXfixes-devel libXScrnSaver-devel libXtst-devel \
            libxkbcommon-devel \
            wayland-devel wayland-protocols-devel libdecor-devel \
            mesa-libGL-devel mesa-libEGL-devel libdrm-devel mesa-libgbm-devel \
            pulseaudio-libs-devel alsa-lib-devel dbus-devel systemd-devel \
            libusb1-devel mesa-vulkan-drivers vulkan-loader \
            xorg-x11-server-Xvfb \
            nasm make perl-IPC-Cmd perl-FindBin perl-File-Compare perl-File-Copy \
            perl-Time-Piece zip unzip tar zstd pkgconf-pkg-config kernel-headers

      - uses: actions/checkout@v5
        with: { submodules: true }

      - uses: actions/cache/restore@v6
        id: downloads
        with:
          path: |
            .downloads/*
            !.downloads/cesium-*.sqlite
            !.downloads/test-scratch
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-${{ github.run_id }}
          restore-keys: |
            downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-
            downloads-
          enableCrossOsArchive: true

      # **The compiler gate against a real old compiler**, not a described one.
      # Rocky 9's own g++ is GCC 11; the configure must stop and say what it
      # found and what it needs.
      - name: Rocky 9's own GCC 11 is refused
        run: |
          g++ --version | head -1
          if CXX=g++ cmake -S . -B build/system-gcc -G Ninja > system-gcc.log 2>&1; then
            cat system-gcc.log
            echo "::error::the system GCC was accepted"
            exit 1
          fi
          cat system-gcc.log
          grep -F "required: GNU 14 or newer" system-gcc.log

      - name: Keep vcpkg's binary cache in the workspace
        shell: bash
        run: |
          mkdir -p .vcpkg-archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-archives" >> "$GITHUB_ENV"
      # **vcpkg's cache is keyed on the toolchain as well as the ports.** vcpkg
      # hashes the compiler into every package's ABI, and GitHub rolls new runner
      # images out with new compilers (MSVC 19.51.36257 to .36260, 2026-09-01): on
      # the new image every package missed and was rebuilt, 26-28 minutes, and the
      # rebuild was never saved because the key still matched. With the image (or,
      # on Rocky, the toolset) in the key, a new toolchain misses once and saves.
      - name: The toolchain vcpkg's packages are built with
        id: toolchain
        shell: bash
        run: |
          if [ -n "${ImageVersion:-}" ]; then id="$ImageOS-$ImageVersion"
          else id="$(rpm -q gcc-toolset-14-gcc-c++ 2>/dev/null || g++ --version | head -1)"; fi
          echo "id=$(printf '%s' "$id" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"
          echo "vcpkg's toolchain: $id"
      - uses: actions/cache/restore@v6
        id: vcpkg-cache
        with:
          path: .vcpkg-archives
          key: vcpkg-rocky9-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}
          restore-keys: |
            vcpkg-rocky9-${{ steps.toolchain.outputs.id }}-
            vcpkg-rocky9-
      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-rocky9-linux-release-${{ github.sha }}
          restore-keys: ccache-rocky9-linux-release-

      - name: linux-release - configure
        run: |
          source /opt/rh/gcc-toolset-14/enable
          cmake --preset linux-release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - uses: actions/cache/save@v6
        if: ${{ github.event_name != 'pull_request' && !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        with:
          path: .vcpkg-archives
          key: vcpkg-rocky9-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}

      - name: linux-release - build
        run: |
          source /opt/rh/gcc-toolset-14/enable
          ccache --zero-stats
          cmake --build --preset linux-release
          ccache --show-stats
      - uses: actions/cache/save@v6
        if: ${{ github.event_name != 'pull_request' && !cancelled() }}
        with:
          path: .ccache
          key: ccache-rocky9-linux-release-${{ github.sha }}
      - uses: ./.github/actions/prune-cache
        if: ${{ github.event_name != 'pull_request' && !cancelled() }}
        with:
          prefix: ccache-rocky9-linux-release-
          keep: ccache-rocky9-linux-release-${{ github.sha }}
          token: ${{ github.token }}

      - name: linux-release - tests
        run: |
          source /opt/rh/gcc-toolset-14/enable
          Xvfb :99 -screen 0 1280x1024x24 & xvfb=$!
          rc=0; DISPLAY=:99 ctest --preset linux-release || rc=$?
          kill $xvfb
          exit $rc

      - name: Flights for the cross-platform check
        run: |
          mkdir -p flights
          ./build/linux-release/glideslope_cli figures c172p > flights/rocky-gcc.figures.txt
          ./build/linux-release/glideslope_cli selftest > flights/rocky-gcc.selftest.txt
          ./build/linux-release/glideslope_cli air > flights/rocky-gcc.air.txt
          cat flights/*
      - uses: actions/upload-artifact@v7
        with: { name: flights-rocky-gcc, path: flights/, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with: { name: frames-rocky, path: build/linux-release/tests/frames/*.bmp, if-no-files-found: ignore }
      # **3 GB saved once per pinned list on a merge, not on every merge.** On
      # a push to main this saves only when what was restored was not of these
      # lists: every merge saved another 3 GB beside the last though nothing
      # it pins had changed (run 37569407795 beside 37560605889's), and the
      # two stood together until the run's end. The nightly run still saves
      # it, so a file the tests fetch beyond the lists is kept within a day.
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.event_name != 'push' || !startsWith(steps.downloads.outputs.cache-matched-key, format('downloads-{0}-', hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp')))) }}
        with:
          path: |
            .downloads/*
            !.downloads/cesium-*.sqlite
            !.downloads/test-scratch
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-${{ github.run_id }}
          enableCrossOsArchive: true

  # ---------------------------------------------------------------------------
  # macOS
  # ---------------------------------------------------------------------------
  macos-build:
    name: macOS ${{ matrix.preset }} - build
    # actions: write, to prune main's older ccache once this one is saved.
    permissions: { contents: read, actions: write }
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: { preset: [macos-debug, macos-release] }
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 600M
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/macos-setup

      - name: Keep vcpkg's binary cache in the workspace
        run: |
          mkdir -p .vcpkg-archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-archives" >> "$GITHUB_ENV"
      # **vcpkg's cache is keyed on the toolchain as well as the ports.** vcpkg
      # hashes the compiler into every package's ABI, and GitHub rolls new runner
      # images out with new compilers (MSVC 19.51.36257 to .36260, 2026-09-01): on
      # the new image every package missed and was rebuilt, 26-28 minutes, and the
      # rebuild was never saved because the key still matched. With the image (or,
      # on Rocky, the toolset) in the key, a new toolchain misses once and saves.
      - name: The toolchain vcpkg's packages are built with
        id: toolchain
        shell: bash
        run: |
          if [ -n "${ImageVersion:-}" ]; then id="$ImageOS-$ImageVersion"
          else id="$(rpm -q gcc-toolset-14-gcc-c++ 2>/dev/null || g++ --version | head -1)"; fi
          echo "id=$(printf '%s' "$id" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"
          echo "vcpkg's toolchain: $id"
      - uses: actions/cache/restore@v6
        id: vcpkg-cache
        with:
          path: .vcpkg-archives
          key: vcpkg-macos-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}
          restore-keys: |
            vcpkg-macos-${{ steps.toolchain.outputs.id }}-
            vcpkg-macos-
      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-macos-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-macos-${{ matrix.preset }}-

      - name: ${{ matrix.preset }} - configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
      - uses: actions/cache/save@v6
        if: ${{ github.event_name != 'pull_request' && !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        with:
          path: .vcpkg-archives
          key: vcpkg-macos-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}

      - name: ${{ matrix.preset }} - build
        run: |
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }}
          ccache --show-stats
      - uses: actions/cache/save@v6
        if: ${{ github.event_name != 'pull_request' && !cancelled() }}
        with:
          path: .ccache
          key: ccache-macos-${{ matrix.preset }}-${{ github.sha }}
      - uses: ./.github/actions/prune-cache
        if: ${{ github.event_name != 'pull_request' && !cancelled() }}
        with:
          prefix: ccache-macos-${{ matrix.preset }}-
          keep: ccache-macos-${{ matrix.preset }}-${{ github.sha }}
          token: ${{ github.token }}

      - name: Pack what the tests need
        run: |
          tar -czf tree.tar.gz --exclude='*.o' --exclude='*.a' --exclude=CMakeFiles \
              --exclude=.ninja_deps --exclude=.ninja_log --exclude='frames' \
              build/${{ matrix.preset }}
          ls -la tree.tar.gz
      - uses: actions/upload-artifact@v7
        with: { name: 'tree-macos-${{ matrix.preset }}', path: tree.tar.gz, retention-days: 1, compression-level: 0 }

      - name: Flights for the cross-platform check
        if: ${{ matrix.preset == 'macos-release' }}
        run: |
          mkdir -p flights
          ./build/macos-release/glideslope_cli figures c172p > flights/macos-appleclang.figures.txt
          ./build/macos-release/glideslope_cli selftest > flights/macos-appleclang.selftest.txt
          ./build/macos-release/glideslope_cli air > flights/macos-appleclang.air.txt
          cat flights/*
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.preset == 'macos-release' }}
        with: { name: flights-macos-appleclang, path: flights/, if-no-files-found: error }

  macos-test:
    name: macOS ${{ matrix.preset }} - tests ${{ matrix.shard }}/${{ matrix.of }}
    needs: macos-build
    if: ${{ github.event_name != 'push' }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: macos-debug, shard: 1, of: 5 }
          - { preset: macos-debug, shard: 2, of: 5 }
          - { preset: macos-debug, shard: 3, of: 5 }
          - { preset: macos-debug, shard: 4, of: 5 }
          - { preset: macos-debug, shard: 5, of: 5 }
          - { preset: macos-release, shard: 1, of: 2 }
          - { preset: macos-release, shard: 2, of: 2 }
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/macos-setup
      - uses: actions/cache/restore@v6
        with:
          path: |
            .downloads/*
            !.downloads/cesium-*.sqlite
            !.downloads/test-scratch
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-${{ github.run_id }}
          restore-keys: |
            downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-
            downloads-
          enableCrossOsArchive: true
      - uses: actions/download-artifact@v8
        with: { name: 'tree-macos-${{ matrix.preset }}' }
      - run: tar -xzf tree.tar.gz && rm tree.tar.gz

      - name: ${{ matrix.preset }} - tests ${{ matrix.shard }} of ${{ matrix.of }}
        run: |
          cmake -DPRESET=${{ matrix.preset }} -DSHARD=${{ matrix.shard }} -DOF=${{ matrix.of }} -DOUT=shard.txt -P tools/ci_shard.cmake
          ctest --preset ${{ matrix.preset }} -I "$PWD/shard.txt" ${{ endsWith(matrix.preset, '-debug') && '-LE timing' || '' }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with: { name: 'frames-macos-${{ matrix.preset }}-${{ matrix.shard }}', path: 'build/${{ matrix.preset }}/tests/frames/*.bmp', if-no-files-found: ignore }
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          path: |
            .downloads/*
            !.downloads/cesium-*.sqlite
            !.downloads/test-scratch
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-${{ github.run_id }}
          enableCrossOsArchive: true

  # ---------------------------------------------------------------------------
  # Windows: MSVC's debug and release builds and clang-cl's, each its own job.
  # ---------------------------------------------------------------------------
  windows-build:
    name: Windows ${{ matrix.preset }} - build
    # actions: write, to prune main's older ccache once this one is saved.
    permissions: { contents: read, actions: write }
    runs-on: windows-latest
    # For whether it may upload vcpkg's packages.
    needs: changes
    # A build whose caches missed takes most of 45 minutes (44 for one pull
    # request on 2026-09-25), and one was cancelled at step 1215 of 1239.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: { preset: [windows-debug, windows-release, windows-clang] }
    # SDL says why it will not use a GPU driver only in its GPU log, which is
    # quiet by default; a failed frame test then shows the reason.
    env:
      SDL_LOGGING: gpu=debug
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/windows-setup
      - uses: ./.github/actions/vcpkg-github-packages
        with:
          token: ${{ secrets.VCPKG_PAT }}
          write: ${{ needs.changes.outputs.vcpkg-write }}

      # **ccache, as on Linux and macOS**: without it each Windows build
      # compiled everything from nothing, 17-19 minutes on every push. ccache
      # 4.x caches cl.exe and clang-cl through the same compiler launcher, but
      # not a compile that writes a PDB (/Zi) or uses a precompiled header
      # (SDL's): so here, and only here, the debug information goes in each
      # object (/Z7) and precompiled headers are off. The linker still writes
      # each program's PDB from its objects, which is what "The stack of every
      # crash" reads. A developer's own build is untouched: all of it is on
      # the configure's command line below. The download is pinned by SHA-256.
      - name: Install ccache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dir = Join-Path $env:RUNNER_TEMP 'ccache'
          $zip = "$dir.zip"
          Invoke-WebRequest -Uri 'https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-windows-x86_64.zip' -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4') { throw "ccache's zip is $actual" }
          7z e $zip "-o$dir" 'ccache-4.14.1-windows-x86_64\ccache.exe' -y | Out-Null
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$dir\ccache.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "ccache does not run" }
      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-windows-${{ matrix.preset }}-

      # The debug preset names /Zi in its flags itself, for the vendored
      # projects too old for CMAKE_MSVC_DEBUG_INFORMATION_FORMAT (CMP0141);
      # here they are the same flags with /Z7. ccache refuses any /clang:
      # option: clang-cl reports its headers as cl.exe does here
      # (cmake/ci_clang_cl_show_includes.cmake), and SDL is told clang-cl has
      # no /clang:-fcomment-block-commands, which only names a documentation
      # command (@threadsafety) for -Wdocumentation-unknown-command - so that
      # warning, which would then fire 265 times in SDL, is off with it.
      - name: ${{ matrix.preset }} - configure
        shell: cmd
        run: |
          if "${{ matrix.preset }}"=="windows-clang" (clang-cl --version || exit /b 1)
          set cache=-DHAVE_CLANG_COMMENT_BLOCK_COMMANDS=OFF -DHAVE_GCC_WDOCUMENTATION_UNKNOWN_COMMAND=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DCMAKE_PROJECT_INCLUDE=%CD%/cmake/ci_clang_cl_show_includes.cmake
          if "${{ matrix.preset }}"=="windows-debug" (
            cmake --preset windows-debug %cache% "-DCMAKE_C_FLAGS_DEBUG=/Z7 /Ob1 /O1" "-DCMAKE_CXX_FLAGS_DEBUG=/Z7 /Ob1 /O1"
          ) else (
            cmake --preset ${{ matrix.preset }} %cache%
          )
      # All of vcpkg's output, kept: the configure prints only its summary.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with: { name: 'vcpkg-install-${{ matrix.preset }}', path: 'build/${{ matrix.preset }}/vcpkg-install.log', if-no-files-found: warn, retention-days: 14 }

      - name: ${{ matrix.preset }} - build
        shell: cmd
        run: |
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }} || exit /b 1
          ccache --show-stats
      - uses: actions/cache/save@v6
        if: ${{ github.event_name != 'pull_request' && !cancelled() }}
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.preset }}-${{ github.sha }}
      - uses: ./.github/actions/prune-cache
        if: ${{ github.event_name != 'pull_request' && !cancelled() }}
        with:
          prefix: ccache-windows-${{ matrix.preset }}-
          keep: ccache-windows-${{ matrix.preset }}-${{ github.sha }}
          token: ${{ github.token }}

      # Programs and test data, not objects or import libraries - and of the
      # symbols, only the programs' own PDBs, so that a crash in a test prints
      # its stack with names (src/platform/no_crash_dialogs.hpp).
      - name: Pack what the tests need
        shell: bash
        run: |
          b=build/${{ matrix.preset }}
          tar -cf tree.tar --exclude='*.obj' --exclude='*.pdb' --exclude='*.ilk' --exclude='*.lib' \
              --exclude=CMakeFiles --exclude=.ninja_deps --exclude=.ninja_log --exclude=frames "$b"
          for exe in "$b"/*.exe "$b"/tests/*.exe; do
            pdb="${exe%.exe}.pdb"
            if [ -f "$pdb" ]; then tar -rf tree.tar "$pdb"; ls -la "$pdb"; fi
          done
          gzip -1 tree.tar
          ls -la tree.tar.gz
      - uses: actions/upload-artifact@v7
        with: { name: 'tree-windows-${{ matrix.preset }}', path: tree.tar.gz, retention-days: 1, compression-level: 0 }

      - name: Flights for the cross-platform check
        if: ${{ matrix.preset != 'windows-debug' }}
        shell: cmd
        run: |
          mkdir flights
          if "${{ matrix.preset }}"=="windows-release" (set tag=windows-msvc) else (set tag=windows-clang-cl)
          build\${{ matrix.preset }}\glideslope_cli.exe figures c172p > flights\%tag%.figures.txt || exit /b 1
          build\${{ matrix.preset }}\glideslope_cli.exe selftest > flights\%tag%.selftest.txt || exit /b 1
          build\${{ matrix.preset }}\glideslope_cli.exe air > flights\%tag%.air.txt || exit /b 1
          type flights\*
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.preset != 'windows-debug' }}
        with: { name: 'flights-${{ matrix.preset }}', path: flights/, if-no-files-found: error }

  windows-test:
    name: Windows ${{ matrix.preset }} - tests ${{ matrix.shard }}/${{ matrix.of }}
    needs: windows-build
    if: ${{ github.event_name != 'push' }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: windows-debug, shard: 1, of: 7 }
          - { preset: windows-debug, shard: 2, of: 7 }
          - { preset: windows-debug, shard: 3, of: 7 }
          - { preset: windows-debug, shard: 4, of: 7 }
          - { preset: windows-debug, shard: 5, of: 7 }
          - { preset: windows-debug, shard: 6, of: 7 }
          - { preset: windows-debug, shard: 7, of: 7 }
          - { preset: windows-release, shard: 1, of: 3 }
          - { preset: windows-release, shard: 2, of: 3 }
          - { preset: windows-release, shard: 3, of: 3 }
          - { preset: windows-clang, shard: 1, of: 3 }
          - { preset: windows-clang, shard: 2, of: 3 }
          - { preset: windows-clang, shard: 3, of: 3 }
    env:
      SDL_LOGGING: gpu=debug
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/windows-setup
      - uses: actions/cache/restore@v6
        with:
          path: |
            .downloads/*
            !.downloads/cesium-*.sqlite
            !.downloads/test-scratch
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-${{ github.run_id }}
          restore-keys: |
            downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-
            downloads-
          enableCrossOsArchive: true
      - uses: actions/download-artifact@v8
        with: { name: 'tree-windows-${{ matrix.preset }}' }
      - shell: cmd
        run: tar -xzf tree.tar.gz && del tree.tar.gz

      # **A crash is written down by Windows, not only by the program.** Two
      # tests crashed on the way out - after their work was done - and the
      # program's own handlers (src/platform/no_crash_dialogs.hpp) printed
      # nothing: a crash in the process's own shutdown comes where they
      # cannot. Windows Error Reporting's local dumps catch it from outside,
      # and the step after the tests reads each dump's stack with cdb. The
      # programs write a dump of their own first crash too, into the same
      # folder, from inside the fault (GLIDESLOPE_CRASH_DUMPS): WER's is of the
      # process as it died, which can be long after the fault that began it.
      - name: Keep a dump of any crash
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value "$env:RUNNER_TEMP\dumps" -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 20 -Force | Out-Null
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\dumps" | Out-Null
          "GLIDESLOPE_CRASH_DUMPS=$env:RUNNER_TEMP\dumps" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: ${{ matrix.preset }} - tests ${{ matrix.shard }} of ${{ matrix.of }}
        shell: cmd
        run: |
          cmake -DPRESET=${{ matrix.preset }} -DSHARD=${{ matrix.shard }} -DOF=${{ matrix.of }} -DOUT=shard.txt -P tools/ci_shard.cmake || exit /b 1
          ctest --preset ${{ matrix.preset }} -I %CD%\shard.txt ${{ endsWith(matrix.preset, '-debug') && '-LE timing' || '' }}

      - name: The stack of every crash
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $dumps = Get-ChildItem "$env:RUNNER_TEMP\dumps" -Filter *.dmp -ErrorAction SilentlyContinue
          if (-not $dumps) { Write-Output "no crash dumps"; exit 0 }
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue
          if (-not $cdb) { Write-Output "no cdb on this runner; dumps: $($dumps.Name -join ', ')"; exit 0 }
          $symbols = (Get-ChildItem build\${{ matrix.preset }} -Recurse -Filter *.pdb | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique) -join ';'
          # Windows' own symbols from Microsoft's server, so ntdll's frames are
          # named rather than guessed from its exports.
          $symbols = "$symbols;srv*$env:RUNNER_TEMP\symbols*https://msdl.microsoft.com/download/symbols"
          # The exception, its thread's stack deep enough to reach the thread's
          # start, every other thread's, and the debugger's own analysis.
          foreach ($d in $dumps) {
            Write-Output "===== $($d.Name)"
            & $cdb.FullName -z $d.FullName -y "$symbols" -c ".exr -1; .ecxr; kn 200; ~*kn 60; !analyze -v; q"
          }
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with: { name: 'frames-windows-${{ matrix.preset }}-${{ matrix.shard }}', path: 'build/${{ matrix.preset }}/tests/frames/*.bmp', if-no-files-found: ignore }
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with: { name: 'dumps-windows-${{ matrix.preset }}-${{ matrix.shard }}', path: '${{ runner.temp }}/dumps/*.dmp', if-no-files-found: ignore, retention-days: 3 }
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          path: |
            .downloads/*
            !.downloads/cesium-*.sqlite
            !.downloads/test-scratch
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-${{ github.run_id }}
          enableCrossOsArchive: true

  # ---------------------------------------------------------------------------
  # The same flights everywhere.
  #
  # The simulation is floating point and the machines differ, so the selftest's
  # hash is not compared across them. What is compared is what the aircraft does:
  # every published figure within 1% across every platform, and the five-minute
  # selftest ending in the same place within stated tolerances; and the air, a
  # thousand samples of gusts and turbulence within 1e-9 m/s. See
  # tests/cmake/cross_platform_flights.cmake.
  # ---------------------------------------------------------------------------
  cross-platform:
    name: The same flights everywhere
    needs: [ubuntu-build, rocky, macos-build, windows-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with: { pattern: flights-*, path: flights, merge-multiple: true }
      - name: Compare
        run: cmake -DDIR=flights -P tests/cmake/cross_platform_flights.cmake

  # ---------------------------------------------------------------------------
  # The server as it is deployed: deploy/Dockerfile's image, built with
  # -DGLIDESLOPE_SERVER_ONLY=ON, and a server started from it accepting a
  # client. Nothing built that configuration before this job, and the image
  # had never been built at all - so neither was known to work.
  # ---------------------------------------------------------------------------
  server-image:
    name: The server's container image
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t glideslope-server .
      - name: A server started from it accepts a client
        run: |
          docker run -d --name server --network host glideslope-server \
              --headless --port 47801 --ai 0 --seconds 120 \
              --store /var/lib/glideslope/server.sqlite
          key=""
          for i in $(seq 60); do
            key=$(docker logs server 2>&1 | sed -n 's/^server key \([0-9a-f]\{64\}\)$/\1/p')
            [ -n "$key" ] && break
            sleep 1
          done
          if [ -z "$key" ]; then docker logs server; echo "the server printed no key"; exit 1; fi
          docker run --rm --network host --entrypoint /opt/glideslope/glideslope_cli \
              glideslope-server connect "127.0.0.1:47801" "$key" 3
          docker logs server
          docker logs server 2>&1 | grep -q "^admitted " || { echo "the server admitted nobody"; exit 1; }
          docker run --rm --entrypoint /opt/glideslope/glideslope_server glideslope-server \
              --window --seconds 1 --ai 0 2>&1 | tee window.txt || true
          grep -q "built without one" window.txt || { echo "--window was not refused as built without one"; exit 1; }

  # ---------------------------------------------------------------------------
  # **Packaging, when the build could have changed it** - package.yml, called
  # here so that a pull request that breaks a package fails its gate rather
  # than main after it. What counts as the build is the list below; a change
  # outside it cannot change what a package holds.
  # ---------------------------------------------------------------------------
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      vcpkg-write: ${{ steps.vcpkg.outputs.write }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # **Who may upload vcpkg's packages to GitHub Packages**: main, and a
      # pull request whose diff touches nothing that could change how they
      # build without changing their ABI hash - the workflows and actions,
      # the CMake that runs before vcpkg, its manifest and configuration, the
      # Cesium Native pointer (.github/actions/vcpkg-github-packages says why).
      # Anything else, or a diff that cannot be taken, only reads.
      - id: vcpkg
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          write=false
          if [ "$EVENT" != pull_request ]; then
            if [ "$REF" = refs/heads/main ]; then write=true; fi
          elif [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null \
               && changed=$(git diff --name-only "$BASE" "$HEAD"); then
            if echo "$changed" | grep -Eq '^(\.github/|cmake/|CMakeLists\.txt$|CMakePresets\.json$|vcpkg\.json$|vcpkg-configuration\.json$|\.gitmodules$|ext/cesium-native$)'; then
              echo "this pull request changes what could shape vcpkg's packages; they are only read"
            else
              write=true
            fi
          fi
          echo "vcpkg's packages uploaded: $write"
          echo "write=$write" >> "$GITHUB_OUTPUT"
      - id: decide
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "no base to compare with; packaging anyway"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          if echo "$changed" | grep -Eq '^(CMakeLists\.txt|CMakePresets\.json|cmake/|ext/|assets/|\.gitmodules|vcpkg\.json|vcpkg-configuration\.json|\.github/workflows/package\.yml|\.github/actions/|src/frontend/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' && github.event_name != 'push' }}
    uses: ./.github/workflows/package.yml
    # Its Windows job takes vcpkg's packages from GitHub Packages (VCPKG_PAT).
    secrets: inherit
    with:
      vcpkg-write: ${{ needs.changes.outputs.vcpkg-write }}

  # ---------------------------------------------------------------------------
  # **Main keeps one cache of each kind, not one per commit.** Each build on
  # main saves its ccache under the commit it built, and each test job saves
  # the downloads under the run; the repository's caches share 10 GB, and left
  # to pile up, older entries crowded out the ones every pull request restores
  # from, so builds compiled everything from nothing (0% hits). Once this
  # run's entry of a kind is there, every older entry of that kind on main
  # goes; a kind whose save failed (a warning, not a red job) keeps what it
  # had.
  prune-caches:
    name: Old caches pruned
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: [ubuntu-build, ubuntu-test, rocky, macos-build, macos-test, windows-build, windows-test]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete main's entries older than this run's, kind by kind
        run: |
          keys=$(gh cache list --ref refs/heads/main --limit 500 --json key --jq '.[].key')
          prune() {  # prune PREFIX NEWEST: delete PREFIX* but NEWEST, if NEWEST is there
            if ! grep -qxF -- "$2" <<< "$keys"; then
              echo "keeping every $1 entry: this run's $2 is not there"; return
            fi
            grep -- "^$1" <<< "$keys" | grep -vxF -- "$2" | while read -r key; do
              echo "deleting $key"; gh cache delete "$key" --ref refs/heads/main || true
            done
          }
          for p in ubuntu-linux-debug ubuntu-linux-release rocky9-linux-release \
                   macos-macos-debug macos-macos-release \
                   windows-windows-debug windows-windows-release windows-windows-clang; do
            prune "ccache-$p-" "ccache-$p-${{ github.sha }}"
          done
          newest=$(grep '^downloads-.*-${{ github.run_id }}$' <<< "$keys" | head -1)
          [[ -n "$newest" ]] && prune downloads- "$newest" \
            || echo "keeping every downloads entry: this run saved none"
          gh cache list --limit 100 --json key,sizeInBytes,ref \
            --jq '.[] | "\(.sizeInBytes / 1048576 | floor) MB \(.ref) \(.key)"'

  # **CI passed**: every job above, green. It is the one check main's
  # protection asks for, so that a job added, renamed or split into shards is
  # covered without the protection being edited to name it.
  # ---------------------------------------------------------------------------
  all-green:
    name: CI passed
    if: ${{ always() }}
    needs: [ubuntu-build, ubuntu-test, rocky, macos-build, macos-test, windows-build,
            windows-test, cross-platform, server-image, changes, package]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Packaging is skipped when nothing it depends on changed, which is
          # a pass; anything else skipped, failed or cancelled is not.
          # On main, after a merge, only the builds run (the tree was tested
          # before it merged): a job skipped there is a pass too.
          echo "$NEEDS" | jq -e --arg event "${{ github.event_name }}" 'to_entries | all(.[];
              .value.result == "success"
              or (.value.result == "skipped" and (.key == "package" or ($event == "push"
                  and (.key | IN("ubuntu-test", "macos-test", "windows-test", "server-image"))))))' > /dev/null
