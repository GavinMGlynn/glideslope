name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. A newer push says everything an older run would have, so
# the older run is cancelled rather than left to hold a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The windowed frame tests skip where there is no display to open a window on;
# here that is a failure, and the Linux jobs run their tests on Xvfb.
#
# Likewise the tests that read downloaded data - DEM tiles, the geoid - skip
# without the network, and here must not. The downloads are kept between runs
# in .downloads, keyed on the list that pins them.
#
# Cesium Native's dependencies are built by vcpkg (cmake/Vcpkg.cmake) - thirty
# libraries, most of an hour's building on a hosted runner. vcpkg's binary
# cache is kept between runs in .vcpkg-archives, keyed on everything that
# decides what is built, and saved as soon as the first configure has filled
# it, so a run whose tests fail still keeps what it built.
env:
  GLIDESLOPE_REQUIRE_WINDOW: 1
  GLIDESLOPE_REQUIRE_NETWORK: 1
  GLIDESLOPE_DOWNLOADS: .downloads

# **No job may take an hour.** Each is stopped at 60 minutes: a run that long
# is a fault to find, not to wait for. The tests run four at a time (three on
# macOS's three cores; CMakePresets.json), the debug builds are optimised -
# sanitized code at -O1 (cmake/Sanitizers.cmake), which keeps every sanitizer
# check, and MSVC's at /O1 (the preset), which keeps its debug runtime and
# iterator checks and gives up /RTC1, that only runs unoptimised - and
# Windows' debug and release builds are two jobs run at once. A hosted runner can be half the speed of
# another, so a job that takes half an hour here can take an hour there. A run that must build vcpkg's libraries afresh - most of an
# hour - can be stopped by the limit; it saves them first, and the next run
# finds them.
#
# **Every preset runs somewhere.** The Linux presets on Ubuntu (both) and Rocky 9
# (release), the macOS presets on macOS, the Windows presets on Windows. A
# preset that no job runs is a preset nobody knows still works.

jobs:
  linux-debian:
    name: Linux x86_64 (GCC 14, Ubuntu)
    runs-on: ubuntu-latest
    # **A job that runs out of time is reported as cancelled, not failed**,
    # so it does not look like a red build and can be missed for a long while.
    # Ubuntu builds both presets and runs the whole suite twice, the sanitized
    # one included, where Rocky 9 builds release alone - which is why it takes
    # four times as long. It ran 60 min 17 s and 60 min 15 s against a
    # 60-minute limit on 2026-09-21 and was cancelled both times, so that
    # platform had quietly stopped being checked. Raised with room for the
    # suite to keep growing.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }

      - uses: actions/cache@v4
        with:
          path: .downloads
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # apt on GitHub's hosted runners stalls intermittently
          # (actions/runner-images#11382). gearstick learned that a hang is only
          # beaten from outside, so each attempt is bounded and retried.
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer \
                              unattended-upgrades.service 2>/dev/null || true
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                    -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60"
          apt_run() {
            for attempt in 1 2 3; do
              if sudo timeout 240 apt-get $APT_OPTS "$@"; then return 0; fi
              echo "::warning::apt attempt $attempt stalled; retrying"
              sudo pkill -9 -f apt-get 2>/dev/null || true
              sudo dpkg --configure -a 2>/dev/null || true
              sleep 10
            done
            echo "::error::apt would not complete in three attempts"
            return 1
          }
          apt_run update
          # SDL's own list, from docs/README-linux.md at the pinned tag - it
          # fails its configure without XTEST and XScrnSaver rather than doing
          # without - and Mesa's lavapipe, the software Vulkan driver the
          # frame tests render on, with the Vulkan loader.
          apt_run install -y --no-install-recommends gcc-14 g++-14 ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl-dev libegl-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev \
            mesa-vulkan-drivers libvulkan1 xvfb \
            nasm zip unzip pkg-config

      - name: Keep vcpkg's binary cache in the workspace
        shell: bash
        run: |
          mkdir -p .vcpkg-archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-archives" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: .vcpkg-archives
          key: vcpkg-ubuntu-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**') }}
          restore-keys: vcpkg-ubuntu-

      - name: linux-debug - configure
        env: { CXX: g++-14, CC: gcc-14 }
        run: cmake --preset linux-debug
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        with:
          path: .vcpkg-archives
          key: vcpkg-ubuntu-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**') }}

      - name: linux-debug - build, test
        env: { CXX: g++-14, CC: gcc-14 }
        run: |
          cmake --build --preset linux-debug
          Xvfb :99 -screen 0 1280x1024x24 & xvfb=$!
          rc=0; DISPLAY=:99 ctest --preset linux-debug || rc=$?
          kill $xvfb
          exit $rc

      - name: linux-release - configure, build, test
        # Runs even when the preset before it failed, so one red preset does
        # not hide whether the next one is green.
        if: ${{ !cancelled() }}
        env: { CXX: g++-14, CC: gcc-14 }
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release
          Xvfb :99 -screen 0 1280x1024x24 & xvfb=$!
          rc=0; DISPLAY=:99 ctest --preset linux-release || rc=$?
          kill $xvfb
          exit $rc

      # For the cross-platform job at the end: what this platform's release
      # build flies. See tests/cmake/cross_platform_flights.cmake.
      - name: Flights for the cross-platform check
        run: |
          mkdir -p flights
          ./build/linux-release/glideslope_cli figures c172p > flights/ubuntu-gcc.figures.txt
          ./build/linux-release/glideslope_cli selftest > flights/ubuntu-gcc.selftest.txt
          ./build/linux-release/glideslope_cli air > flights/ubuntu-gcc.air.txt
          cat flights/*
      - uses: actions/upload-artifact@v4
        with: { name: flights-ubuntu-gcc, path: flights/, if-no-files-found: error }
      # Every frame the tests wrote, to look at.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: frames-ubuntu, path: build/linux-*/tests/frames/*.bmp, if-no-files-found: error }

  linux-rhel:
    name: Linux x86_64 (GCC 14, Rocky 9)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: rockylinux/rockylinux:9
    steps:
      # Rocky 9's own compiler is GCC 11, so the build uses gcc-toolset-14, as
      # REQUIREMENTS.md's RHEL note says. ninja-build is in CRB.
      # `install_weak_deps=False` is dnf's --no-install-recommends.
      - name: Install dependencies
        run: |
          dnf_opts="--setopt=install_weak_deps=False --setopt=tsflags=nodocs -y"
          # Rocky's mirrors go away for minutes at a time, and gearstick's CI
          # learned to tell that apart from a real failure by retrying.
          dnf_run() {
            for attempt in 1 2 3 4; do
              if dnf $dnf_opts "$@"; then return 0; fi
              echo "::warning::dnf attempt $attempt failed; clearing the cache and retrying"
              dnf clean all || true
              sleep $((attempt * 15))
            done
            echo "::error::dnf would not complete in four attempts"
            return 1
          }
          # EPEL and CRB for SDL's X11 and Wayland development packages, and
          # Mesa's lavapipe for the frame tests.
          dnf_run install epel-release
          dnf_run --enablerepo=crb install git cmake ninja-build gcc-c++ \
            gcc-toolset-14-gcc-c++ \
            libX11-devel libXext-devel libXrandr-devel libXi-devel \
            libXcursor-devel libXfixes-devel libXScrnSaver-devel libXtst-devel \
            libxkbcommon-devel \
            wayland-devel wayland-protocols-devel libdecor-devel \
            mesa-libGL-devel mesa-libEGL-devel libdrm-devel mesa-libgbm-devel \
            pulseaudio-libs-devel alsa-lib-devel dbus-devel systemd-devel \
            libusb1-devel mesa-vulkan-drivers vulkan-loader \
            xorg-x11-server-Xvfb \
            nasm make perl-IPC-Cmd perl-FindBin perl-File-Compare perl-File-Copy \
            perl-Time-Piece zip unzip tar pkgconf-pkg-config kernel-headers

      - uses: actions/checkout@v5
        with: { submodules: true }

      - uses: actions/cache@v4
        with:
          path: .downloads
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}

      # **The compiler gate against a real old compiler**, not a described one.
      # Rocky 9's own g++ is GCC 11; the configure must stop and say what it
      # found and what it needs.
      - name: Rocky 9's own GCC 11 is refused
        run: |
          g++ --version | head -1
          if CXX=g++ cmake -S . -B build/system-gcc -G Ninja > system-gcc.log 2>&1; then
            cat system-gcc.log
            echo "::error::the system GCC was accepted"
            exit 1
          fi
          cat system-gcc.log
          grep -F "required: GNU 14 or newer" system-gcc.log

      - name: Keep vcpkg's binary cache in the workspace
        shell: bash
        run: |
          mkdir -p .vcpkg-archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-archives" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: .vcpkg-archives
          key: vcpkg-rocky9-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**') }}
          restore-keys: vcpkg-rocky9-

      - name: linux-release - configure
        run: |
          source /opt/rh/gcc-toolset-14/enable
          cmake --preset linux-release
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        with:
          path: .vcpkg-archives
          key: vcpkg-rocky9-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**') }}

      - name: linux-release - build, test
        run: |
          source /opt/rh/gcc-toolset-14/enable
          cmake --build --preset linux-release
          Xvfb :99 -screen 0 1280x1024x24 & xvfb=$!
          rc=0; DISPLAY=:99 ctest --preset linux-release || rc=$?
          kill $xvfb
          exit $rc

      - name: Flights for the cross-platform check
        run: |
          mkdir -p flights
          ./build/linux-release/glideslope_cli figures c172p > flights/rocky-gcc.figures.txt
          ./build/linux-release/glideslope_cli selftest > flights/rocky-gcc.selftest.txt
          ./build/linux-release/glideslope_cli air > flights/rocky-gcc.air.txt
          cat flights/*
      - uses: actions/upload-artifact@v4
        with: { name: flights-rocky-gcc, path: flights/, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: frames-rocky, path: build/linux-release/tests/frames/*.bmp, if-no-files-found: error }

  macos:
    name: macOS arm64 (AppleClang)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }

      - uses: actions/cache@v4
        with:
          path: .downloads
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}

      - name: Install ninja, and nasm for vcpkg
        run: brew install ninja nasm

      # The newest Xcode the image carries, rather than whichever it selected.
      - name: Use the newest Xcode on the image
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          c++ --version

      - name: Keep vcpkg's binary cache in the workspace
        shell: bash
        run: |
          mkdir -p .vcpkg-archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-archives" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: .vcpkg-archives
          key: vcpkg-macos-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**') }}
          restore-keys: vcpkg-macos-

      - name: macos-debug - configure
        run: cmake --preset macos-debug
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        with:
          path: .vcpkg-archives
          key: vcpkg-macos-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**') }}

      - name: macos-debug - build, test
        run: |
          cmake --build --preset macos-debug
          ctest --preset macos-debug

      - name: macos-release - configure, build, test
        # Runs even when the preset before it failed, so one red preset does
        # not hide whether the next one is green.
        if: ${{ !cancelled() }}
        run: |
          cmake --preset macos-release
          cmake --build --preset macos-release
          ctest --preset macos-release

      - name: Flights for the cross-platform check
        run: |
          mkdir -p flights
          ./build/macos-release/glideslope_cli figures c172p > flights/macos-appleclang.figures.txt
          ./build/macos-release/glideslope_cli selftest > flights/macos-appleclang.selftest.txt
          ./build/macos-release/glideslope_cli air > flights/macos-appleclang.air.txt
          cat flights/*
      - uses: actions/upload-artifact@v4
        with: { name: flights-macos-appleclang, path: flights/, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: frames-macos, path: build/macos-*/tests/frames/*.bmp, if-no-files-found: error }

  # Two jobs, run at once: MSVC's debug build, whose tests are the slowest -
  # unoptimised, with the standard library's iterator checks - and the release
  # builds, MSVC's and clang-cl's. One after another in one job they took most
  # of two hours.
  windows:
    name: Windows x64 (${{ matrix.title }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: debug, title: MSVC debug, first: windows-debug }
          - { part: release, title: MSVC release and clang-cl, first: windows-release }
    # SDL says why it will not use a GPU driver only in its GPU log, which is
    # quiet by default; a failed frame test then shows the reason.
    env:
      SDL_LOGGING: gpu=debug
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }

      - uses: actions/cache@v4
        with:
          path: .downloads
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}

      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }

      # Windows runners have no GPU, and no Vulkan loader or driver. Direct3D 12
      # draws on WARP, which Windows has; Vulkan gets what the Linux jobs draw
      # on: Mesa's lavapipe, from mesa-dist-win, and the Khronos loader from
      # LunarG's runtime components. Each download is pinned by SHA-256.
      - name: Install a software Vulkan driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dir = Join-Path $env:RUNNER_TEMP 'vulkan'
          New-Item -ItemType Directory -Force $dir | Out-Null
          function Fetch($url, $file, $sha256) {
            Invoke-WebRequest -Uri $url -OutFile $file
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $sha256) { throw "$url is $actual, expected $sha256" }
          }
          Fetch 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.0/mesa3d-26.2.0-release-msvc.7z' `
                "$dir\mesa.7z" 'dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47'
          Fetch 'https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/VulkanRT-X64-1.4.357.0-Components.zip' `
                "$dir\runtime.zip" 'a14672efed15aafc7f5a16572d35cd3a3416eadf670aeee3cdf50ee32d5fbf83'
          7z e "$dir\mesa.7z" "-o$dir" 'x64\vulkan_lvp.dll' 'x64\lvp_icd.x86_64.json' -y | Out-Null
          7z e "$dir\runtime.zip" "-o$dir" 'VulkanRT-X64-1.4.357.0-Components\x64\vulkan-1.dll' 'VulkanRT-X64-1.4.357.0-Components\x64\vulkaninfo.exe' -y | Out-Null
          foreach ($f in 'vulkan_lvp.dll', 'lvp_icd.x86_64.json', 'vulkan-1.dll', 'vulkaninfo.exe') {
            if (-not (Test-Path "$dir\$f")) {
              7z l "$dir\mesa.7z" | Select-String 'lvp|vulkan'
              throw "$f was not in the archive where expected"
            }
          }
          # Registered, not named by VK_DRIVER_FILES: the runner's processes are
          # elevated, and the Vulkan loader ignores that variable in an elevated
          # process. The registry it always reads.
          $drivers = 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers'
          New-Item -Path $drivers -Force | Out-Null
          New-ItemProperty -Path $drivers -Name "$dir\lvp_icd.x86_64.json" -PropertyType DWord -Value 0 -Force | Out-Null
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Get-Content "$dir\lvp_icd.x86_64.json"
          # What the loader finds, before anything is built on it.
          $env:PATH = "$dir;$env:PATH"
          & "$dir\vulkaninfo.exe" --summary
          if ($LASTEXITCODE -ne 0) { throw "the Vulkan loader found no usable driver" }

      - name: Keep vcpkg's binary cache in the workspace
        shell: bash
        run: |
          mkdir -p .vcpkg-archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-archives" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: .vcpkg-archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**') }}
          restore-keys: vcpkg-windows-

      - name: ${{ matrix.first }} - configure
        shell: cmd
        run: cmake --preset ${{ matrix.first }}
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        with:
          path: .vcpkg-archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**') }}

      - name: ${{ matrix.first }} - build, test
        shell: cmd
        run: |
          cmake --build --preset ${{ matrix.first }} || exit /b 1
          ctest --preset ${{ matrix.first }} || exit /b 1

      - name: windows-clang - configure, build, test
        # Runs even when the preset before it failed, so one red preset does
        # not hide whether the next one is green.
        if: ${{ !cancelled() && matrix.part == 'release' }}
        shell: cmd
        run: |
          clang-cl --version || exit /b 1
          cmake --preset windows-clang || exit /b 1
          cmake --build --preset windows-clang || exit /b 1
          ctest --preset windows-clang || exit /b 1

      - name: Flights for the cross-platform check
        if: ${{ matrix.part == 'release' }}
        shell: cmd
        run: |
          mkdir flights
          build\windows-release\glideslope_cli.exe figures c172p > flights\windows-msvc.figures.txt || exit /b 1
          build\windows-release\glideslope_cli.exe selftest > flights\windows-msvc.selftest.txt || exit /b 1
          build\windows-release\glideslope_cli.exe air > flights\windows-msvc.air.txt || exit /b 1
          build\windows-clang\glideslope_cli.exe figures c172p > flights\windows-clang-cl.figures.txt || exit /b 1
          build\windows-clang\glideslope_cli.exe selftest > flights\windows-clang-cl.selftest.txt || exit /b 1
          build\windows-clang\glideslope_cli.exe air > flights\windows-clang-cl.air.txt || exit /b 1
          type flights\*
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.part == 'release' }}
        with: { name: flights-windows, path: flights/, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: 'frames-windows-${{ matrix.part }}', path: build/windows-*/tests/frames/*.bmp, if-no-files-found: error }

  # ---------------------------------------------------------------------------
  # The same flights everywhere.
  #
  # The simulation is floating point and the machines differ, so the selftest's
  # hash is not compared across them. What is compared is what the aircraft does:
  # every published figure within 1% across every platform, and the five-minute
  # selftest ending in the same place within stated tolerances; and the air, a
  # thousand samples of gusts and turbulence within 1e-9 m/s. See
  # tests/cmake/cross_platform_flights.cmake.
  # ---------------------------------------------------------------------------
  cross-platform:
    name: The same flights everywhere
    needs: [linux-debian, linux-rhel, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { pattern: flights-*, path: flights, merge-multiple: true }
      - name: Compare
        run: cmake -DDIR=flights -P tests/cmake/cross_platform_flights.cmake
