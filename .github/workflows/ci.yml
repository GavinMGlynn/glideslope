# THROWAWAY - not to be merged. Asks one question of a macOS runner: do the
# weather services (aviationweather.gov, api.open-meteo.com) stall from it?
# The HUD tick test on Metal skipped after 334 s, which is five 60 s stalls
# plus the 2+4+8+16 s between them.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Weather services, with curl and with URLSession, for 12 minutes
        run: |
          cat > probe.swift <<'EOF'
          import Foundation
          let url = URL(string: CommandLine.arguments[1])!
          var r = URLRequest(url: url, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 60)
          r.setValue("glideslope", forHTTPHeaderField: "User-Agent")
          let c = URLSessionConfiguration.ephemeral
          c.timeoutIntervalForRequest = 60
          let s = URLSession(configuration: c)
          let sem = DispatchSemaphore(value: 0)
          let t0 = Date()
          s.dataTask(with: r) { d, a, e in
              let dt = Date().timeIntervalSince(t0)
              if let e = e { print(String(format: "urlsession %.2f s error %@", dt, e.localizedDescription)) }
              else { print(String(format: "urlsession %.2f s status %d bytes %d", dt, (a as! HTTPURLResponse).statusCode, d?.count ?? 0)) }
              sem.signal()
          }.resume()
          sem.wait()
          EOF
          swiftc -O probe.swift -o probe
          M='https://aviationweather.gov/api/data/metar?ids=YSSY&format=json'
          B='https://aviationweather.gov/api/data/metar?bbox=-34.8,150.1,-33.0,152.2&format=json'
          O='https://api.open-meteo.com/v1/forecast?latitude=-33.9461&longitude=151.1772&hourly=wind_speed_850hPa,wind_direction_850hPa&wind_speed_unit=ms&timezone=GMT&forecast_days=1'
          end=$(( $(date +%s) + 720 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            for u in "$M" "$B" "$O"; do
              echo "$(date -u +%H:%M:%S) ${u:8:24}"
              curl -s -o /dev/null -A glideslope --max-time 60 -w "curl %{time_total} s status %{http_code} ip %{remote_ip} connect %{time_connect} tls %{time_appconnect} first %{time_starttransfer}\n" "$u" || echo "curl failed $?"
              ./probe "$u" &
            done
            wait
            sleep 5
          done
