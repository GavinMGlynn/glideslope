# Does a package actually work?
#
# **A package is a folder somebody unpacks and runs**, so that is exactly what
# this checks: build it, unpack it somewhere else entirely, and run the program
# out of the unpacked copy - not "cpack exited zero", which says nothing about
# whether the program inside can run.
#
# It runs `glideslope_cli --version`, whose version must match the one in the
# package's file name; `glideslope_cli aircraft c172p`, which only works if the
# aircraft data travelled with the program; and `glideslope_cli selftest`, which
# flies five minutes out of the unpacked copy; and `glideslope_cli height` at
# Sydney airport, which downloads a DEM tile and the geoid into an empty cache
# through the system's own HTTP client and must give the same height everywhere;
# `glideslope_cli weather YSSY`, which fetches Sydney's METAR and the winds
# aloft over it and must print every level and Open-Meteo's credit; and the
# client, `glideslope`, headless on the platform's GPU driver, which flies five
# seconds of the flight screen in Sydney's weather and writes its frame -
# uploaded, one from every platform.
#
# **Part of every pull request's gate when the build could have changed it**:
# ci.yml calls this workflow when the build, the assets, the dependencies or
# this file changed (its `changes` job decides), and "CI passed" counts it. On
# demand too.
name: package

on:
  workflow_call:
  workflow_dispatch:

jobs:
  linux:
    name: Linux x86_64 tarball (built on Rocky 9)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Built on the oldest distribution supported, so the program asks for no
    # newer C library than the oldest one it will meet. gcc-toolset-14 links
    # against the system's own libstdc++ and puts only the newer parts inside
    # the program, which is why the tarball runs where the toolset is absent.
    container: rockylinux/rockylinux:9
    steps:
      - name: Install dependencies
        run: |
          dnf_opts="--setopt=install_weak_deps=False --setopt=tsflags=nodocs -y"
          dnf_run() {
            for attempt in 1 2 3 4; do
              if dnf $dnf_opts "$@"; then return 0; fi
              echo "::warning::dnf attempt $attempt failed; clearing the cache and retrying"
              dnf clean all || true
              sleep $((attempt * 15))
            done
            echo "::error::dnf would not complete in four attempts"
            return 1
          }
          # SDL's development packages: the package build compiles the client
          # too, even though the package does not carry it yet.
          dnf_run install epel-release
          # autoconf, autoconf-archive, automake and libtool: vcpkg's libsodium
          # port builds with autotools and asks the system for them. Every other
          # port was coming from the binary cache, so libsodium - added for the
          # handshake on 2026-09-22 - was the first to build here, and every
          # Linux and macOS job failed on it from then on.
          dnf_run --enablerepo=crb install git cmake ninja-build gcc-toolset-14-gcc-c++ \
            autoconf autoconf-archive automake libtool \
            libX11-devel libXext-devel libXrandr-devel libXi-devel \
            libXcursor-devel libXfixes-devel libXScrnSaver-devel libXtst-devel \
            libxkbcommon-devel \
            wayland-devel wayland-protocols-devel libdecor-devel \
            mesa-libGL-devel mesa-libEGL-devel libdrm-devel mesa-libgbm-devel \
            pulseaudio-libs-devel alsa-lib-devel dbus-devel systemd-devel \
            libusb1-devel \
            nasm make perl-IPC-Cmd perl-FindBin perl-File-Compare perl-File-Copy \
            perl-Time-Piece zip unzip tar pkgconf-pkg-config kernel-headers

      - uses: actions/checkout@v5
        with: { submodules: true }

      - name: Keep vcpkg's binary cache in the workspace
        shell: bash
        run: |
          mkdir -p .vcpkg-archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-archives" >> "$GITHUB_ENV"
      # The same cache CI keeps: the same platform builds the same packages.
      - uses: actions/cache/restore@v6
        id: vcpkg-cache
        with:
          path: .vcpkg-archives
          key: vcpkg-rocky9-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}
          restore-keys: vcpkg-rocky9-

      - name: Configure
        run: |
          source /opt/rh/gcc-toolset-14/enable
          cmake --preset linux-release
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        with:
          path: .vcpkg-archives
          key: vcpkg-rocky9-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}

      - name: Build and package
        run: |
          source /opt/rh/gcc-toolset-14/enable
          cmake --build --preset linux-release
          cpack --preset linux-release

      - uses: actions/upload-artifact@v7
        with:
          name: package-linux
          path: build/linux-release/glideslope-*-linux-x86_64.tar.gz*
          if-no-files-found: error

  # **Machines that have never had a toolchain on them.** Unpacking on the
  # machine that built the package proves less than it looks, so the tarball is
  # run in a stock container from each Linux family, with nothing installed.
  linux-elsewhere:
    name: Linux tarball, run on ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'rockylinux/rockylinux:9', label: rocky9 }
          - { image: 'ubuntu:24.04', label: ubuntu24 }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with: { name: package-linux, path: downloaded }

      - name: Unpack somewhere else and run it
        shell: bash
        run: |
          set -euo pipefail
          cd downloaded
          sha256sum -c glideslope-*-linux-x86_64.tar.gz.sha256
          file=$(ls glideslope-*-linux-x86_64.tar.gz)
          version=${file#glideslope-}; version=${version%%-linux-x86_64.tar.gz}
          mkdir -p /tmp/elsewhere
          tar xzf "$file" -C /tmp/elsewhere
          cd /tmp/elsewhere/glideslope-"$version"-linux-x86_64
          ls -la
          said=$(./glideslope_cli --version)
          echo "said: $said"
          test "$said" = "glideslope_cli $version" \
            || { echo "::error::expected 'glideslope_cli $version'"; exit 1; }
          ./glideslope_cli aircraft c172p
          ./glideslope_cli selftest
          # Downloads go through the system's libcurl, which a stock Ubuntu
          # container does not have: there it must say so, and then work once
          # libcurl is installed.
          export GLIDESLOPE_CACHE=/tmp/glideslope-cache
          if ! ./glideslope_cli height -33.9461 151.1772 > height.txt 2>&1; then
            cat height.txt
            grep -q "install libcurl" height.txt \
              || { echo "::error::the height failed for another reason"; exit 1; }
            apt-get update && apt-get install -y --no-install-recommends libcurl4t64 ca-certificates
            ./glideslope_cli height -33.9461 151.1772 > height.txt
          fi
          cat height.txt
          h=$(awk '/above sea level/ {print $(NF-1)}' height.txt)
          awk -v h="$h" 'BEGIN { exit !(h > 6.224 && h < 6.244) }' \
            || { echo "::error::Sydney airport at $h m, not 6.234 m"; exit 1; }
          ./glideslope_cli weather YSSY | tee weather.txt
          test "$(grep -c ' hPa .* m  *from ' weather.txt)" = 19 \
            || { echo "::error::the weather does not have 19 levels"; exit 1; }
          grep -q "Weather data by Open-Meteo.com" weather.txt \
            || { echo "::error::the weather does not credit Open-Meteo"; exit 1; }
          # The licences of what is linked in travel with it.
          for licence in JSBSim expat GeographicLib SDL CesiumNative vcpkg/s2geometry vcpkg/openssl; do
            test -s "licenses/$licence.txt" || { echo "::error::no licenses/$licence.txt"; exit 1; }
          done
          # A frame needs a Vulkan driver, which a machine with a GPU has and a
          # stock container does not: Mesa's lavapipe, installed for it. And
          # gdb: the client flies under it, so that a crash - one segfault here
          # on ubuntu:24.04 in run 35336574744, gone when run again - leaves
          # every thread's stack in the log. Its status is the client's.
          if command -v dnf > /dev/null; then
            dnf install -y --setopt=install_weak_deps=False mesa-vulkan-drivers vulkan-loader gdb
          else
            apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 gdb
          fi
          gdb -q -batch -return-child-result -ex "handle SIGPIPE nostop noprint pass" \
            -ex run -ex "thread apply all bt" --args \
            ./glideslope --headless --gpu-driver vulkan --size 640x480 --screen flight \
            --weather YSSY --shot-at 600 --shot "$GITHUB_WORKSPACE/frame-linux-${{ matrix.label }}.bmp"

      - uses: actions/upload-artifact@v7
        with:
          name: frame-linux-${{ matrix.label }}
          path: frame-linux-${{ matrix.label }}.bmp
          if-no-files-found: error

  macos:
    name: macOS arm64 tarball
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }

      # autotools too: vcpkg's libsodium port builds with them.
      - name: Install ninja, and nasm and autotools for vcpkg
        run: brew install ninja nasm autoconf autoconf-archive automake libtool

      - name: Use the newest Xcode on the image
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi

      - name: Keep vcpkg's binary cache in the workspace
        shell: bash
        run: |
          mkdir -p .vcpkg-archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-archives" >> "$GITHUB_ENV"
      # The same cache CI keeps: the same platform builds the same packages.
      - uses: actions/cache/restore@v6
        id: vcpkg-cache
        with:
          path: .vcpkg-archives
          key: vcpkg-macos-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}
          restore-keys: vcpkg-macos-

      - name: Configure
        run: cmake --preset macos-release
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        with:
          path: .vcpkg-archives
          key: vcpkg-macos-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}

      - name: Build and package
        run: |
          cmake --build --preset macos-release
          cpack --preset macos-release

      - name: Unpack somewhere else and run it
        run: |
          set -euo pipefail
          cd build/macos-release
          shasum -a 256 -c glideslope-*-macos-arm64.tar.gz.sha256
          file=$(ls glideslope-*-macos-arm64.tar.gz)
          version=${file#glideslope-}; version=${version%%-macos-arm64.tar.gz}
          mkdir -p "$RUNNER_TEMP/elsewhere"
          tar xzf "$file" -C "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere/glideslope-$version-macos-arm64"
          ls -la
          otool -L glideslope_cli
          said=$(./glideslope_cli --version)
          echo "said: $said"
          test "$said" = "glideslope_cli $version" \
            || { echo "::error::expected 'glideslope_cli $version'"; exit 1; }
          ./glideslope_cli aircraft c172p
          ./glideslope_cli selftest
          export GLIDESLOPE_CACHE="$RUNNER_TEMP/glideslope-cache"
          ./glideslope_cli height -33.9461 151.1772 | tee height.txt
          h=$(awk '/above sea level/ {print $(NF-1)}' height.txt)
          awk -v h="$h" 'BEGIN { exit !(h > 6.224 && h < 6.244) }' \
            || { echo "::error::Sydney airport at $h m, not 6.234 m"; exit 1; }
          ./glideslope_cli weather YSSY | tee weather.txt
          test "$(grep -c ' hPa .* m  *from ' weather.txt)" = 19 \
            || { echo "::error::the weather does not have 19 levels"; exit 1; }
          grep -q "Weather data by Open-Meteo.com" weather.txt \
            || { echo "::error::the weather does not credit Open-Meteo"; exit 1; }
          ./glideslope --headless --gpu-driver metal --size 640x480 --screen flight \
            --weather YSSY --shot-at 600 --shot "$GITHUB_WORKSPACE/frame-macos.bmp"

      - uses: actions/upload-artifact@v7
        with:
          name: frame-macos
          path: frame-macos.bmp
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: package-macos
          path: build/macos-release/glideslope-*-macos-arm64.tar.gz*
          if-no-files-found: error

  windows:
    name: Windows x64 zip
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }

      - uses: ./.github/actions/msvc-dev-env

      - name: Keep vcpkg's binary cache in the workspace
        shell: bash
        run: |
          mkdir -p .vcpkg-archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-archives" >> "$GITHUB_ENV"
      # The same cache CI keeps: the same platform builds the same packages.
      - uses: actions/cache/restore@v6
        id: vcpkg-cache
        with:
          path: .vcpkg-archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}
          restore-keys: vcpkg-windows-

      - name: Configure
        shell: cmd
        run: cmake --preset windows-release
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        with:
          path: .vcpkg-archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}

      - name: Build and package
        shell: cmd
        run: |
          cmake --build --preset windows-release || exit /b 1
          cpack --preset windows-release || exit /b 1

      - name: Unpack somewhere else and run it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem build/windows-release/glideslope-*-windows-x64.zip | Select-Object -First 1
          $version = $zip.Name -replace '^glideslope-', '' -replace '-windows-x64\.zip$', ''
          $expected = (Get-Content "$($zip.FullName).sha256").Split(' ')[0]
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "checksum mismatch: $actual, expected $expected" }

          $dest = Join-Path $env:RUNNER_TEMP 'elsewhere'
          Expand-Archive $zip.FullName -DestinationPath $dest
          $exe = Join-Path $dest "glideslope-$version-windows-x64\glideslope_cli.exe"
          Get-ChildItem (Split-Path $exe)

          $said = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "glideslope_cli exited $LASTEXITCODE" }
          Write-Output "said: $said"
          if ($said -ne "glideslope_cli $version") { throw "expected 'glideslope_cli $version'" }
          & $exe aircraft c172p
          if ($LASTEXITCODE -ne 0) { throw "glideslope_cli aircraft c172p exited $LASTEXITCODE" }
          & $exe selftest
          if ($LASTEXITCODE -ne 0) { throw "glideslope_cli selftest exited $LASTEXITCODE" }
          $env:GLIDESLOPE_CACHE = Join-Path $env:RUNNER_TEMP 'glideslope-cache'
          $height = & $exe height -33.9461 151.1772
          if ($LASTEXITCODE -ne 0) { throw "glideslope_cli height exited $LASTEXITCODE" }
          $height | Write-Output
          $h = [double](($height | Select-String 'above sea level').ToString().Split(' ', [StringSplitOptions]::RemoveEmptyEntries)[-2])
          if ($h -le 6.224 -or $h -ge 6.244) { throw "Sydney airport at $h m, not 6.234 m" }
          $weather = & $exe weather YSSY
          if ($LASTEXITCODE -ne 0) { throw "glideslope_cli weather exited $LASTEXITCODE" }
          $weather | Write-Output
          $levels = @($weather | Select-String ' hPa .* m +from ').Count
          if ($levels -ne 19) { throw "the weather has $levels levels, not 19" }
          if (-not ($weather | Select-String -SimpleMatch 'Weather data by Open-Meteo.com')) { throw "the weather does not credit Open-Meteo" }
          $client = Join-Path (Split-Path $exe) 'glideslope.exe'
          & $client --headless --gpu-driver direct3d12 --size 640x480 --screen flight `
            --weather YSSY --shot-at 600 --shot (Join-Path $env:GITHUB_WORKSPACE 'frame-windows.bmp')
          if ($LASTEXITCODE -ne 0) { throw "glideslope exited $LASTEXITCODE" }

          # The runner has the Visual C++ redistributable; somebody's computer
          # may not. The runtime is linked in, so the program must not ask for it.
          foreach ($program in $exe, $client) {
            $deps = dumpbin /dependents $program
            $deps | Write-Output
            if ($deps -match '(?i)vcruntime|msvcp') {
              throw "$program depends on the Visual C++ redistributable"
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: frame-windows
          path: frame-windows.bmp
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: build/windows-release/glideslope-*-windows-x64.zip*
          if-no-files-found: error
