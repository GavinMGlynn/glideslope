# Nightly: the tests that run programs against each other, over and over.
#
# **Why**: a test with a server and its clients in it depends on how they
# overlap in time, and a test that passed once on a fast machine failed on a
# slow runner - fewer players let in, a drop that came on the last frame, an
# aeroplane that had not flown long enough. A pull request's run tries each
# once. This tries each five times, every night, on main, so that one that
# only sometimes passes is found here rather than in somebody's pull request.
#
# The tests chosen are the ones whose names say they run a server, a client, a
# window or a package against each other - the ones timing can break.
name: nightly

on:
  schedule:
    # 17:00 UTC is three in the morning in Sydney, when nobody is pushing.
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      macos_network_repeats:
        description: How many times macOS runs each network check (split over four runners)
        type: number
        default: 100
      linux_repeats:
        description: Run the Linux multi-process tests five times each as well
        type: boolean
        default: false

jobs:
  repeat:
    name: The multi-process tests, five times each
    # Every night; by hand only when asked, so that asking for the macOS
    # repeats does not also spend an hour of Linux on them.
    if: ${{ github.event_name == 'schedule' || inputs.linux_repeats }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CXX: g++-14
      CC: gcc-14
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 700M
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/ubuntu-setup
      - name: Keep vcpkg's binary cache in the workspace
        run: |
          mkdir -p .vcpkg-archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-archives" >> "$GITHUB_ENV"
      # **vcpkg's cache is keyed on the toolchain as well as the ports.** vcpkg
      # hashes the compiler into every package's ABI, and GitHub rolls new runner
      # images out with new compilers (MSVC 19.51.36257 to .36260, 2026-09-01): on
      # the new image every package missed and was rebuilt, 26-28 minutes, and the
      # rebuild was never saved because the key still matched. With the image (or,
      # on Rocky, the toolset) in the key, a new toolchain misses once and saves.
      - name: The toolchain vcpkg's packages are built with
        id: toolchain
        shell: bash
        run: |
          if [ -n "${ImageVersion:-}" ]; then id="$ImageOS-$ImageVersion"
          else id="$(rpm -q gcc-toolset-14-gcc-c++ 2>/dev/null || g++ --version | head -1)"; fi
          echo "id=$(printf '%s' "$id" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"
          echo "vcpkg's toolchain: $id"
      - uses: actions/cache/restore@v6
        with:
          path: .vcpkg-archives
          key: vcpkg-ubuntu-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}
          restore-keys: |
            vcpkg-ubuntu-${{ steps.toolchain.outputs.id }}-
            vcpkg-ubuntu-
      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-ubuntu-linux-debug-${{ github.sha }}
          restore-keys: ccache-ubuntu-linux-debug-
      - uses: actions/cache/restore@v6
        with:
          path: |
            .downloads/*
            !.downloads/cesium-*.sqlite
            !.downloads/test-scratch
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-${{ github.run_id }}
          restore-keys: |
            downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-
            downloads-
          enableCrossOsArchive: true
      - name: Build
        run: |
          cmake --preset linux-debug -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          cmake --build --preset linux-debug
      - name: Five times each
        run: |
          Xvfb :99 -screen 0 1280x1024x24 & xvfb=$!
          rc=0
          DISPLAY=:99 ctest --preset linux-debug -j2 --repeat until-fail:5 \
              -R 'server|client|window|player|collision|systemd|online|package' -LE timing || rc=$?
          kill $xvfb
          exit $rc
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          path: |
            .downloads/*
            !.downloads/cesium-*.sqlite
            !.downloads/test-scratch
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'assets/models/sources.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-${{ github.run_id }}
          enableCrossOsArchive: true

  # **Every speed a plan may ask of every aircraft, flown.** The speeds each
  # aircraft may be planned at (its figures file's <plan_speeds>) are ticked
  # as held at every 5 kt between its slowest and fastest - round its
  # tightest orbit four ways, and a heading in calm air and a crosswind -
  # and pull requests fly only the two ends. This flies all of them, every
  # night, with `glideslope_cli plan-speeds ID --every`, which exits 1 if any
  # speed does not hold. About 360 speeds; in linux-release on a workstation,
  # three aircraft at a time, some 40 minutes.
  plan-speeds:
    name: Every speed a plan may ask of every aircraft
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CXX: g++-14
      CC: gcc-14
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 700M
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/ubuntu-setup
      - name: Keep vcpkg's binary cache in the workspace
        run: |
          mkdir -p .vcpkg-archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-archives" >> "$GITHUB_ENV"
      - name: The toolchain vcpkg's packages are built with
        id: toolchain
        shell: bash
        run: |
          if [ -n "${ImageVersion:-}" ]; then id="$ImageOS-$ImageVersion"
          else id="$(rpm -q gcc-toolset-14-gcc-c++ 2>/dev/null || g++ --version | head -1)"; fi
          echo "id=$(printf '%s' "$id" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: .vcpkg-archives
          key: vcpkg-ubuntu-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}
          restore-keys: |
            vcpkg-ubuntu-${{ steps.toolchain.outputs.id }}-
            vcpkg-ubuntu-
      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-ubuntu-linux-release-${{ github.sha }}
          restore-keys: ccache-ubuntu-linux-release-
      - name: Build the command-line tool
        run: |
          cmake --preset linux-release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          cmake --build --preset linux-release --target glideslope_cli
      - name: Every speed of every aircraft
        run: |
          mkdir -p plan-speeds
          ./build/linux-release/glideslope_cli aircraft | awk '{print $1}' > plan-speeds/ids.txt
          test "$(wc -l < plan-speeds/ids.txt)" -eq 16
          rc=0
          xargs -P4 -I{} sh -c './build/linux-release/glideslope_cli plan-speeds {} --every > plan-speeds/{}.txt 2>&1 || echo {} >> plan-speeds/failed.txt' < plan-speeds/ids.txt
          grep -h "speeds from" plan-speeds/*.txt
          test "$(grep -l 'speeds from' plan-speeds/*.txt | wc -l)" -eq 16 || rc=1
          if [ -s plan-speeds/failed.txt ]; then echo "not held:"; cat plan-speeds/failed.txt; rc=1; fi
          exit $rc
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: plan-speeds
          path: plan-speeds

  # **The network checks on macOS, over and over.** The interpolation they hold
  # to 2 m drew frames 8 m off on macOS CI, and nowhere else, once in a while
  # (COMPLETION_PLAN.md): a once-in-a-while failure is shown gone only by
  # many runs where it happened. Each night twenty of each, five on each of
  # four runners; run by hand (`gh workflow run nightly.yml --ref BRANCH -f
  # macos_network_repeats=100`), as many as asked. Every run is counted, a
  # skipped one is not a pass, and a failed one keeps its tracks.
  #
  # **Its time.** The two checks take some 68 s a run on a macOS runner, and
  # building what they need about a minute from ccache: a hundred of each
  # over four runners took 30 to 31 minutes a runner (run 36705059324), and
  # the timeout is three times that. The four
  # wait for macOS runners like any other job, and at 17:00 UTC they share
  # them with whatever else is queued - a dispatched run waited twenty
  # minutes for its first two (2026-09-30).
  macos-network:
    name: macOS - the network checks, runner ${{ matrix.runner }} of 4
    if: ${{ github.event_name == 'schedule' || inputs.macos_network_repeats > 0 }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: { runner: [1, 2, 3, 4] }
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 600M
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/macos-setup
      - name: Keep vcpkg's binary cache in the workspace
        run: |
          mkdir -p .vcpkg-archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.vcpkg-archives" >> "$GITHUB_ENV"
      - name: The toolchain vcpkg's packages are built with
        id: toolchain
        shell: bash
        run: |
          id="$ImageOS-$ImageVersion"
          echo "id=$(printf '%s' "$id" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: .vcpkg-archives
          key: vcpkg-macos-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/Vcpkg.cmake', 'cmake/triplets/*.cmake', 'ext/cesium-native/extern/vcpkg/ports/**', 'cmake/ports/**') }}
          restore-keys: |
            vcpkg-macos-${{ steps.toolchain.outputs.id }}-
            vcpkg-macos-
      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-macos-macos-debug-${{ github.sha }}
          restore-keys: ccache-macos-macos-debug-
      - uses: actions/cache/restore@v6
        with:
          path: |
            .downloads/*
            !.downloads/cesium-*.sqlite
            !.downloads/test-scratch
          key: downloads-${{ hashFiles('tests/data/downloads/files.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-${{ github.run_id }}
          restore-keys: |
            downloads-${{ hashFiles('tests/data/downloads/files.txt', 'tests/data/dem/surveyed.txt', 'tests/unit/test_ground.cpp') }}-
            downloads-
          enableCrossOsArchive: true
      - name: Build what the network checks run
        run: |
          cmake --preset macos-debug -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset macos-debug --target glideslope_server glideslope_cli glideslope_impair glideslope_interpolation_check
      - name: Each network check, again and again
        shell: bash
        env:
          REPEATS: ${{ inputs.macos_network_repeats || 20 }}
        run: |
          runs=$(( (REPEATS + 3) / 4 ))
          passed=0 failed=0 skipped=0
          mkdir -p failed
          for i in $(seq 1 "$runs"); do
            out=$(ctest --preset macos-debug -R 'hold_at_(100|200)_ms' --output-on-failure 2>&1 || true)
            p=$(grep -cE 'Test +#[0-9]+: .* +Passed' <<<"$out" || true)
            f=$(grep -cE 'Test +#[0-9]+: .*\*\*\*(Failed|Timeout|Exception)' <<<"$out" || true)
            s=$(grep -cE 'Test +#[0-9]+: .*Skipped' <<<"$out" || true)
            passed=$((passed + p)) failed=$((failed + f)) skipped=$((skipped + s))
            echo "run $i of $runs: $p passed, $f failed, $s skipped"
            if (( p + f + s != 2 )); then echo "$out"; echo "run $i did not run both checks"; exit 1; fi
            if (( f > 0 )); then
              echo "$out"
              mkdir -p "failed/run-$i"
              cp -R build/macos-debug/tests/server_impaired_* "failed/run-$i/"
            fi
          done
          echo "the network checks on macOS, runner ${{ matrix.runner }}: $passed passed, $failed failed and $skipped skipped of $((2 * runs))"
          (( failed == 0 && skipped == 0 ))
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with: { name: 'network-tracks-macos-${{ matrix.runner }}', path: failed/, if-no-files-found: ignore }
