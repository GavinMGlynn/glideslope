name: Windows setup
description: >
  What a Windows job needs to build glideslope or run its tests - the same for
  both, so that a test job finds exactly the machine its build was made on.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/msvc-dev-env

    # **One Python, at one path, on every runner image.** The build job's
    # configure writes the Python it found into the tests' command lines, and
    # the test jobs run that tree on whatever image they get. Left to itself,
    # FindPython3 took the newest Python the image registered,
    # C:/hostedtoolcache/windows/Python/3.14.7 (the build tree's CMakeCache);
    # on 2026-10-14 the runners were part way through a new image
    # (20261007.264.1 beside 20260925.250.1) that has 3.14.8 instead, and
    # every test job that landed there failed each script check in a
    # hundredth of a second: "exited no such file or directory" (#203's run
    # 38624857649 - every failing job on the new image, every passing one on
    # the old). Pinned here, Python3_ROOT_DIR - which setup-python sets, and
    # FindPython3 searches before the registry - names the one CMake takes;
    # 3.12.10 is in both images' tool cache, and setup-python fetches it to
    # the same path where it is not. The build checks that the configure
    # found it (tools/ci_python_pinned.cmake).
    - uses: actions/setup-python@v6
      with: { python-version: '3.12.10' }

    # Windows runners have no GPU, and no Vulkan loader or driver. Direct3D 12
    # draws on WARP, which Windows has; Vulkan gets what the Linux jobs draw
    # on: Mesa's lavapipe, from mesa-dist-win, and the Khronos loader from
    # LunarG's runtime components. Each download is pinned by SHA-256.
    - name: Install a software Vulkan driver
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'
        $dir = Join-Path $env:RUNNER_TEMP 'vulkan'
        New-Item -ItemType Directory -Force $dir | Out-Null
        # **A download that hangs is given up and tried again**, never waited
        # on: with no time limit, a fetch that stalled sat until the job's own
        # 45 minutes cancelled it, three times on 2026-10-28 (runs
        # 40640191712, 40649601697, 40664057362 - each job's last line this
        # step's start). Each try may take two minutes to connect and be
        # answered (-TimeoutSec, in PowerShell 7.4 only that), and its body
        # may go a minute without a byte (-OperationTimeoutSeconds, which
        # alone guards a download that stalls part-way); these files, tens of
        # megabytes, take seconds. Four tries, a pause between.
        function Fetch($url, $file, $sha256) {
          $tries = 4
          for ($try = 1; ; $try++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $file -TimeoutSec 120 -OperationTimeoutSeconds 60
              break
            } catch {
              if ($try -ge $tries) { throw "$url failed $tries times: $_" }
              Write-Host "$url, try $try of ${tries}: $_ - trying again"
              Start-Sleep -Seconds (10 * $try)
            }
          }
          $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) { throw "$url is $actual, expected $sha256" }
        }
        Fetch 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.0/mesa3d-26.2.0-release-msvc.7z' `
              "$dir\mesa.7z" 'dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47'
        Fetch 'https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/VulkanRT-X64-1.4.357.0-Components.zip' `
              "$dir\runtime.zip" 'a14672efed15aafc7f5a16572d35cd3a3416eadf670aeee3cdf50ee32d5fbf83'
        7z e "$dir\mesa.7z" "-o$dir" 'x64\vulkan_lvp.dll' 'x64\lvp_icd.x86_64.json' -y | Out-Null
        7z e "$dir\runtime.zip" "-o$dir" 'VulkanRT-X64-1.4.357.0-Components\x64\vulkan-1.dll' 'VulkanRT-X64-1.4.357.0-Components\x64\vulkaninfo.exe' -y | Out-Null
        foreach ($f in 'vulkan_lvp.dll', 'lvp_icd.x86_64.json', 'vulkan-1.dll', 'vulkaninfo.exe') {
          if (-not (Test-Path "$dir\$f")) {
            7z l "$dir\mesa.7z" | Select-String 'lvp|vulkan'
            throw "$f was not in the archive where expected"
          }
        }
        # Registered, not named by VK_DRIVER_FILES: the runner's processes are
        # elevated, and the Vulkan loader ignores that variable in an elevated
        # process. The registry it always reads.
        $drivers = 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers'
        New-Item -Path $drivers -Force | Out-Null
        New-ItemProperty -Path $drivers -Name "$dir\lvp_icd.x86_64.json" -PropertyType DWord -Value 0 -Force | Out-Null
        $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        Get-Content "$dir\lvp_icd.x86_64.json"
        # What the loader finds, before anything is built on it.
        $env:PATH = "$dir;$env:PATH"
        & "$dir\vulkaninfo.exe" --summary
        if ($LASTEXITCODE -ne 0) { throw "the Vulkan loader found no usable driver" }
