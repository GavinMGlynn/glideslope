name: macOS setup
description: >
  What a macOS job needs to build glideslope or run its tests - the same for
  both, so that a test job finds exactly the machine its build was made on.

runs:
  using: composite
  steps:
    # ninja and nasm for vcpkg, autotools for its libsodium port, and ccache so
    # that a push which changes one file recompiles one file.
    - name: Install ninja, nasm, autotools and ccache
      shell: bash
      run: brew install ninja nasm autoconf autoconf-archive automake libtool ccache

    # The tests' Python, pinned. The configure writes the Python it found into
    # the tests' command lines, and the test jobs run that tree on another
    # runner: a build that found Homebrew's newest (/opt/homebrew/bin/python3.15)
    # sent its tree to test runners without it, and every script check failed
    # in a hundredth of a second, "exited no such file or directory" (#273's
    # run 40986292025), as Windows' did on 2026-10-14. setup-python sets
    # Python3_ROOT_DIR, which FindPython3 searches first; the build checks the
    # configure found it (tools/ci_python_pinned.cmake).
    - uses: actions/setup-python@v6
      with: { python-version: '3.12.10' }

    # The newest Xcode the image carries, rather than whichever it selected.
    - name: Use the newest Xcode on the image
      shell: bash
      run: |
        latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
        if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
        c++ --version
